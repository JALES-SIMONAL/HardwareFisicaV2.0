; PlatformIO Project Configuration File
;
; Teste de TOUCH: ESP32-S3 + Display SPI ILI9341 2.8" 240x320
;                 + Touch resistivo XPT2046 (mesmo barramento SPI)
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-n16r8]
; Placa real: ESP32-S3-WROOM-1 N16R8 (16MB flash, 8MB PSRAM Octal)
;
; 6.11.0 = Arduino core 2.0.17.
;
; ATENCAO: o crash "StoreProhibited / EXCVADDR: 0x00000010" em
; begin_tft_write() NAO e causado pela versao do platform - ele acontece
; igual no core 2.x e no 3.x. A correcao e o -DUSE_HSPI_PORT la em
; build_flags (veja a explicacao completa la embaixo). Trocar a versao do
; platform para tentar fugir desse panic nao adianta.
;
; Obs.: o pacote do 6.5.0 nesta maquina esta baixado incompleto - o SDK do
; esp32s3 nao veio junto (so esp32 e esp32c3), entao ele nem compila aqui.
; Se quiser voltar para 6.5.0, apague a pasta
; ~/.platformio/packages/framework-arduinoespressif32@3.20014.231204
; para o PlatformIO baixar o pacote de novo.
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    ; ---- Serial pela USB nativa do ESP32-S3 ----
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; ---- OBRIGATORIO no ESP32-S3: escolher a porta SPI ----
    ; Sem esta linha o firmware da "Guru Meditation StoreProhibited,
    ; EXCVADDR: 0x00000010" dentro de begin_tft_write() no tft.init().
    ;
    ; Motivo: em Processors/TFT_eSPI_ESP32_S3.h, quando nenhuma porta e
    ; escolhida, a lib faz "#define SPI_PORT FSPI". No Arduino core do S3,
    ; FSPI vale 0, e o soc.h do esp32s3 define
    ;   REG_SPI_BASE(i) = ((i)>=2) ? (DR_REG_SPI2_BASE + (i-2)*0x1000) : 0
    ; ou seja, REG_SPI_BASE(0) = 0. Os ponteiros de registrador da lib viram
    ; endereco 0x00/0x10/0x1C, e a primeira escrita (*_spi_user = ...) grava
    ; no endereco 0x10 -> panic. Isso acontece tanto no core 2.x (FSPI=0)
    ; quanto no core 3.x (FSPI=SPI2_HOST=1), entao NAO e um problema so do
    ; core 3.x: trocar a versao do platform sozinho nao resolve.
    ;
    ; USE_HSPI_PORT faz SPI_PORT=3 -> REG_SPI_BASE(3) = SPI3, e a lib passa
    ; a instanciar SPIClass(HSPI), que no core do S3 tambem e o SPI3. Os
    ; dois lados passam a falar do mesmo periferico.
    -DUSE_HSPI_PORT=1

    ; ---- Selecao do driver e resolucao do painel ----
    ; Se aparecer CHUVISCO em parte da tela, e porque o painel real e maior
    ; que a resolucao configurada aqui: a area que o firmware nunca escreve
    ; mostra a RAM nao inicializada do controlador. E o touch fica deslocado
    ; junto, porque a calibracao converte raw -> pixel usando esta resolucao.
    ;
    ; Para descobrir o painel certo: ponha MODO_DIAGNOSTICO em 1 no
    ; src/main.cpp, regrave e leia o ID no monitor serial.
    ;
    ; NAO passe -DTFT_WIDTH/-DTFT_HEIGHT aqui: nao adianta. O
    ; TFT_Drivers/ILI9341_Defines.h redefine os dois SEM #ifndef, entao o
    ; valor do driver sempre vence o que vier por -D (o compilador avisa
    ; "TFT_WIDTH redefined"). Quem escolhe a geometria e a linha do driver.
    ;
    ; A) ILI9341 - 240x320 retrato (2.4"/2.8", ID 93 41):
    ; -DILI9341_DRIVER=1
    ;
    ; B) ILI9488 - 320x480 (3.5", ID 94 88).
    ;    Obs.: o ILI9488 em SPI nao aceita cor de 16 bits, precisa de 18 bits
    ;    (3 bytes por pixel). O TFT_eSPI ja faz isso sozinho quando
    ;    ILI9488_DRIVER esta definido.
    ; -DILI9488_DRIVER=1
    ;
    ; C) ILI9342 - 320x240 DEITADO (ATIVO).
    ;    Sintomas que levaram aqui, todos medidos na tela:
    ;      - chuvisco fixo nos 25% da direita: 240 colunas escritas de 320,
    ;        o resto e RAM do controlador que ninguem escreveu;
    ;      - o rodape (os botoes, y=281) reaparecendo logo abaixo do HUD:
    ;        281-240 = 41, o endereco de linha passa de 240 e da a volta;
    ;      - a cruz do centro (y=160) a 2/3 da altura: 160/240, nao 160/320;
    ;      - os 4 marcadores de calibracao visiveis ao mesmo tempo no terco
    ;        superior, com os de x=239 na borda do chuvisco (239/320 = 75%).
    ;    O ILI9342 (ID 93 42) usa a mesma sequencia de init e a mesma tabela
    ;    de rotacao do ILI9341 - so a memoria e deitada, 320x240 em vez de
    ;    240x320. Por isso o painel aceita o init do ILI9341 e a imagem sai
    ;    quase certa, so que estourando as 240 linhas reais.
    -DILI9342_DRIVER=1

    -DUSER_SETUP_LOADED=1
    -DTFT_RGB_ORDER=1

    ; ---- Pinagem do TFT (barramento SPI) ----
    -DTFT_MOSI=11
    -DTFT_MISO=13
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=14
    -DTFT_BL=15
    -DTFT_BACKLIGHT_ON=HIGH

    ; ---- Touch resistivo XPT2046 (mesmo barramento SPI) ----
    -DTOUCH_CS=8

    ; ---- Velocidades SPI ----
    ; SPI_FREQUENCY manda no tempo de desenho: quanto maior, mais rapido o
    ; rastro aparece. 10MHz e o valor seguro para fiacao com jumper. Com
    ; fiacao curta/soldada, suba para 27000000 ou 40000000 - a resposta
    ; visual melhora bastante.
    -DSPI_FREQUENCY=10000000
    ; Leitura de registrador (o ID do controlador) e bem mais lenta que a
    ; escrita nesses paineis. A 10MHz o 0xD3 costuma voltar lixo; 6MHz le
    ; confiavel. Nao afeta a velocidade de desenho.
    -DSPI_READ_FREQUENCY=6000000
    ; 2.5MHz e o teto pratico do XPT2046. Nao adianta subir mais.
    -DSPI_TOUCH_FREQUENCY=2500000

    ; ---- Fontes/recursos do TFT_eSPI ----
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
