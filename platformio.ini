; HardwareFisicaV2.0 - porte para ESP32-S3 com tela touch
;
; Diferencas de plataforma em relacao ao projeto original (branch main):
;   - Placa: ESP32-S3-WROOM-1 N16R8, no lugar do ESP32 DOIT DevKit V1.
;   - Display: ILI9342 320x240 SPI + touch resistivo XPT2046 via TFT_eSPI,
;     no lugar do ST7735 128x160 via Arduino_GFX (Arduino_SWSPI bit-bang).
;   - Entrada: a propria tela touch, no lugar do encoder rotativo.
; O restante das bibliotecas e do firmware e o mesmo da main.

[env:esp32-s3-n16r8]
; Arduino core 2.0.17. A linha 6.x do platform e proposital: o codigo usa a
; API de LEDC do core 2.x (ledcSetup/ledcAttachPin, em ihm.cpp), que foi
; REMOVIDA no core 3.x — subir de linha exigiria reescrever o controle de
; brilho do backlight.
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
; Particao com bastante espaco de app: o firmware junta NimBLE + TFT_eSPI +
; ArduinoJson + QRCode + NeoPixel, e na particao padrao de 4MB o binario
; ficava perto do limite (era um problema ja apontado na main).
board_build.partitions = default_16MB.csv
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    adafruit/Adafruit NeoPixel
    bblanchon/ArduinoJson@^7.0.4
    ricmoo/QRCode@^0.0.1
    h2zero/NimBLE-Arduino@^1.4.3

build_flags =
    ; ---- Serial pela USB nativa do ESP32-S3 ----
    ; Sem isso, Serial.print() vai para a UART0 (GPIO43/44), que nao esta
    ; ligada em nada: aparecem so as mensagens do bootloader ROM e panics.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; ---- O firmware so atua como periferico BLE (GATT server) ----
    ; Nunca escaneia nem conecta como central. Desabilitar os papeis
    ; CENTRAL/OBSERVER do NimBLE evita linkar codigo de scan/cliente BLE que
    ; nunca e usado, reduzindo o binario final. MAX_CONNECTIONS=1 porque so
    ; ha um app conectado por vez. (Identico a main.)
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

    ; ---- OBRIGATORIO no ESP32-S3: escolher a porta SPI do TFT_eSPI ----
    ; Sem esta linha o firmware da "Guru Meditation StoreProhibited,
    ; EXCVADDR: 0x00000010" dentro de begin_tft_write() no tft.init().
    ; Motivo: em Processors/TFT_eSPI_ESP32_S3.h, sem porta escolhida a lib
    ; faz "#define SPI_PORT FSPI"; no core do S3 FSPI vale 0, e o soc.h do
    ; esp32s3 define REG_SPI_BASE(i) = ((i)>=2) ? ... : 0. Os ponteiros de
    ; registrador viram 0x00/0x10/0x1C e a escrita de *_spi_user grava no
    ; endereco 0x10 -> panic. USE_HSPI_PORT faz SPI_PORT=3 (SPI3) e a lib
    ; instancia SPIClass(HSPI), que no S3 tambem e o SPI3.
    -DUSE_HSPI_PORT=1

    ; ---- Driver e geometria do painel ----
    ; NAO passe -DTFT_WIDTH/-DTFT_HEIGHT: TFT_Drivers/ILI9341_Defines.h
    ; redefine os dois SEM #ifndef, entao o valor do driver sempre vence.
    ; Quem escolhe a geometria e a linha do driver.
    ;   ILI9341_DRIVER -> 240x320 retrato   (ID 93 41)
    ;   ILI9488_DRIVER -> 320x480           (ID 94 88)
    ;   ILI9342_DRIVER -> 320x240 deitado   (ID 93 42)  <- este painel
    -DILI9342_DRIVER=1
    -DUSER_SETUP_LOADED=1
    -DTFT_RGB_ORDER=1

    ; ---- Pinagem do TFT (ver o mapa completo em include/MAIN.HPP) ----
    -DTFT_MOSI=11
    -DTFT_MISO=13
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=14
    -DTFT_BL=15
    -DTFT_BACKLIGHT_ON=HIGH

    ; ---- Touch resistivo XPT2046 (mesmo barramento SPI) ----
    -DTOUCH_CS=8

    ; ---- Velocidades SPI ----
    ; 10MHz e o valor seguro para fiacao com jumper; com fiacao curta e
    ; soldada da para subir para 27000000 ou 40000000 (a IHM redesenha a
    ; tela inteira a cada troca de tela, entao isso e visivel).
    -DSPI_FREQUENCY=10000000
    ; Leitura de registrador e mais lenta que a escrita nesses paineis.
    -DSPI_READ_FREQUENCY=6000000
    ; 2.5MHz e o teto pratico do XPT2046.
    -DSPI_TOUCH_FREQUENCY=2500000

    ; ---- Fontes/recursos do TFT_eSPI ----
    ; LOAD_GLCD e a fonte 5x7 embutida — a mesma metrica (6px de avanco por
    ; caractere, 8px de altura por unidade de tamanho) que o Adafruit_GFX
    ; usado pela main. Isso importa: truncarTexto() e o teclado de texto
    ; calculam largura em cima dessa metrica.
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1

; Ambiente auxiliar só para checagem de compilação dos autotestes internos
; (docs/VALIDACAO_GERAL.md, Fase 32). Não é o ambiente padrão de build.
[env:esp32-s3-n16r8-selftest]
extends = env:esp32-s3-n16r8
build_flags =
    ${env:esp32-s3-n16r8.build_flags}
    -D ENABLE_FIRMWARE_SELF_TESTS=1
